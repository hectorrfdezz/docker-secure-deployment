version: "3.8"
      start_period: 30s
    logging: *default-logging

  db:
    image: mysql:8.0
    container_name: db
    environment:
      - MYSQL_ROOT_PASSWORD=example
      - MYSQL_DATABASE=appdb
    volumes:
      - db_data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - backend_net
    restart: unless-stopped
    cpus: "0.5"
    mem_limit: 512m
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512m
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pexample"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *default-logging

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - static_content:/usr/share/nginx/html:ro
      - ./nginx/conf/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
      - ./nginx/conf/.htpasswd:/etc/nginx/.htpasswd:ro
      - ./nginx/errors:/usr/share/nginx/html/errors:ro
    networks:
      - frontend_net
      - backend_net
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging: *default-logging

  sftp:
    image: atmoz/sftp:latest
    container_name: sftp
    volumes:
      - static_content:/home/sftpuser/upload
    networks:
      - sftp_net
    ports:
      - "2222:22"
    command: sftpuser:password:101:101:upload
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "sh", "-c", "ps -o comm | grep -q sshd"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging: *default-logging

volumes:
  db_data:
  static_content:

networks:
  frontend_net:
    driver: bridge
  backend_net:
    driver: bridge
  sftp_net:
    driver: bridge
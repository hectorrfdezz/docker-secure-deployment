user  nginx;
worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Hide server version information
    server_tokens off;

    # Tune timeouts and upload limits
    keepalive_timeout 65;
    client_max_body_size 10m;

    # Define a zone for rate limiting admin requests
    limit_req_zone $binary_remote_addr zone=adminzone:10m rate=1r/s;

    # HTTP server block to redirect all clear‑text traffic to HTTPS
    server {
        listen 80 default_server;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # HTTPS server block
    server {
        listen 443 ssl;
        server_name _;

        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # Serve the React single page application.  Use try_files to
        # fallback to index.html so that the React router works correctly.
        location / {
            root   /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
        }

        # Proxy API calls to the backend service.  Preserve host and client
        # information for accurate logging and downstream routing.  The
        # trailing slash on the proxy_pass is important to correctly map
        # paths.
        location /api/ {
            proxy_pass http://backend:8080/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Protect the /admin path with HTTP Basic Auth and rate limiting.
        location /admin {
            auth_basic "Restricted Content";
            auth_basic_user_file /etc/nginx/.htpasswd;
            limit_req zone=adminzone burst=5 nodelay;
            proxy_pass http://backend:8080/admin;
        }

        # Custom error pages
        error_page 403 /errors/403.html;
        error_page 404 /errors/404.html;
        error_page 500 502 503 504 /errors/50x.html;
        location = /errors/403.html {
            root /usr/share/nginx/html;
        }
        location = /errors/404.html {
            root /usr/share/nginx/html;
        }
        location = /errors/50x.html {
            root /usr/share/nginx/html;
        }
    }
}
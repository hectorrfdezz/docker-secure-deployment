## Spring Boot configuration file
# Bind the HTTP server port.  The default port of 8080 may be overridden
# via the SERVER_PORT environment variable if desired.
server.port=8080

# Database connectivity settings.  These values are resolved from
# environment variables defined in docker-compose.yml.  If not present
# they fall back to sensible defaults.  The driver is provided by
# mysql-connector-j at runtime.
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# Control the JPA schema generation.  Accepts none|validate|update|create
# If no explicit environment variable is provided the app defaults to
# validate to avoid accidental schema changes in production.
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.show-sql=false

# Suppress the Spring banner at startup for a cleaner log.
spring.main.banner-mode=off